[package]
name = "context"
version = "0.70.0"
edition = "2024"
description = "A fast, fully configurable POSIX shell for Cudane"

[features]
default = ["python"]
python = []

[[bin]]
name = "ctx"
path = "src/main.rs"

[dependencies]
cps = { git = "https://github.com/Mapuse/CPS", rev = "d8d5f7da49917ea7636147b8a65f3541311c45ab" }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
glob = "0.3"
libc = "0.2"
regex = "1"
wallust = "3.5"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
